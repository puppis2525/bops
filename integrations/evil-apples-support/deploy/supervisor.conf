; Install source under /opt/evil-apples-support (this integration's files only).
; Node 24 must be on PATH. Keep this separate from the Bops runner program.
[program:evil-apples-support]
command=/usr/bin/env node --env-file=/etc/evil-apples-support/runtime.env /opt/evil-apples-support/cli.mjs serve
directory=/var/lib/evil-apples-support
autostart=false
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true
umask=0077
redirect_stderr=true
stdout_logfile=/var/log/evil-apples-support.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=2

